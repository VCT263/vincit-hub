name: App iPhone e Mac

# Confere se o app nativo e os widgets compilam (sem assinatura). Roda quando algo muda em apple/.
on:
  push:
    paths: ["apple/**", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["apple/**", ".github/workflows/apple.yml"]
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: VincitHub-iOS
            destination: "generic/platform=iOS Simulator"
          - scheme: VincitHub-macOS
            destination: "generic/platform=macOS"
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: XcodeGen
        run: brew install xcodegen && cd apple && xcodegen generate
      - name: Compilar ${{ matrix.scheme }}
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild build \
            -project VincitHub.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Erros
        if: failure()
        working-directory: apple
        run: grep -B2 -A6 "error:" build.log | head -200 || true
